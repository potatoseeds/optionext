<!DOCTYPE html>
<html lang="zh-CN" data-flavor="desk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>确实 QUESHI · 对话台</title>
<link rel="icon" type="image/png" href="../image/LOGO%E7%AB%96%E7%89%88.png">
<script>
    /* 主题防闪烁：早于一切渲染确定“明 / 暗”另一半 */
    (function () {
        try {
            var t = localStorage.getItem('optionext-theme') ||
                (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.dataset.theme = t;
            /* Astra 防闪烁：首帧前就在 <html> 钉死星域变量。
               否则带颜色过渡的控件（SEND / 档位文字）首帧从日夜色
               起步，会停在错色不回归；此处与主题同机早决。 */
            var qs = JSON.parse(localStorage.getItem('queshi-session-v2') || 'null');
            if (qs && qs.level === 'l3') document.documentElement.dataset.qsAstra = '1';
        } catch (e) {}
    })();
</script>
<script src="../components/device-guard.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style data-page="queshi">
/* ============================================================
   QUESHI 确识 · 对话台 02
   纸墨 / 信号红系统 · Luna·Sol 跟随日夜 · Astra 自成星域
   ============================================================ */
:root {
    --paper: #f4f3ef;
    --paper-deep: #ebe9e2;
    --ink: #141310;
    --ink-rgb: 20, 19, 16;
    --ink-70: rgba(20, 19, 16, .72);
    --ink-45: rgba(20, 19, 16, .42);
    --ink-25: rgba(20, 19, 16, .22);
    --ink-12: rgba(20, 19, 16, .12);
    --signal: #df3b2a;
    --signal-soft: rgba(223, 59, 42, .12);
    --font-sans: "Space Grotesk", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
    --ease-out: cubic-bezier(.22, 1, .36, 1);
}
:root[data-theme="dark"] {
    --paper: #0f0e0c;
    --paper-deep: #16150f;
    --ink: #e9e7e1;
    --ink-rgb: 233, 231, 225;
    --ink-70: rgba(233, 231, 225, .72);
    --ink-45: rgba(233, 231, 225, .45);
    --ink-25: rgba(233, 231, 225, .22);
    --ink-12: rgba(233, 231, 225, .12);
    --signal: #ef4d3a;
    --signal-soft: rgba(239, 77, 58, .16);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-sans);
    font-size: 15px;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
}
::selection { background: var(--ink); color: var(--paper); }
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
a { color: inherit; text-decoration: none; }

::-webkit-scrollbar { width: 10px; }
::-webkit-scrollbar-thumb { background: var(--ink-25); border: 3px solid var(--paper); }
::-webkit-scrollbar-track { background: transparent; }

/* ============================================================
   布局：单列对话台
   页眉为浮动玻璃组件（site-header.js）：锚顶时内容让出顶部安全距，
   锚底时让出底部安全距，保证消息首条与输入区永远不被玻璃压住。
   ============================================================ */
:root {
    --sh-safe-top: 92px;
    /* 锚底避让：玻璃条约 56px + 距屏底 14px + 少量呼吸距，输入区尽量下沉 */
    --sh-safe-bottom: 84px;
}
/* .app 即 <main>：软导航只搬运 <main>，避让与布局都挂在它身上。
   transition 同时包含 page-transit 的淡出淡入属性 */
.app {
    display: flex; flex-direction: column;
    height: 100vh;
    min-width: 0; min-height: 0;
    position: relative; z-index: 1;              /* 压在 fixed 背景层之上，自身无底色 */
    padding-top: var(--sh-safe-top);
    transition: padding .5s var(--ease-out), opacity .24s ease, transform .24s ease;
}
body.sh-dock-bottom .app {
    padding-top: 0;
    padding-bottom: var(--sh-safe-bottom);
}

/* ---------------- 消息流 ---------------- */
.stream {
    flex: 1; overflow-y: auto;
    position: relative;
    min-height: 0;
}
.stream-inner {
    max-width: 860px; margin: 0 auto;
    padding: 36px 40px 20px;
}

/* 整屏背景层（字符雨 / Astra 流星）：fixed 锚定视口，不随消息流滚动 */
#rain {
    position: fixed; inset: 0;
    width: 100vw; height: 100vh;
    opacity: .07; pointer-events: none;
    z-index: 0;
    transition: opacity .8s var(--ease-out);
}

/* 空状态：居中欢迎层（hidden 必须显式压住 display:flex） */
.empty {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 0 40px; text-align: center;
    z-index: 0;
}
.empty[hidden], .stream-inner[hidden] { display: none !important; }
.empty-inner { position: relative; z-index: 1; }
.empty h1 {
    font-family: var(--font-mono);
    font-size: clamp(34px, 5vw, 58px);
    font-weight: 600; letter-spacing: .08em;
    line-height: 1.1;
}
.empty h1 .slash { color: var(--signal); }
@keyframes blink { 50% { opacity: 0; } }

/* 消息行：档案条目式，不做气泡 */
.msg { margin-bottom: 30px; animation: msgIn .5s var(--ease-out) both; }
@keyframes msgIn {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
}
.msg-meta {
    display: flex; align-items: center; gap: 10px;
    font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .16em;
    color: var(--ink-45);
    margin-bottom: 8px;
}
.msg-meta .who { color: var(--ink); }
.msg.msg-ai .msg-meta .who { color: var(--signal); }
.msg-meta .stamp { padding: 1px 6px; border: 1px solid var(--ink-25); }
.msg.msg-ai .msg-meta .stamp { border-color: var(--signal); color: var(--signal); }

.msg-body { font-size: 15.5px; color: var(--ink); }
.msg.msg-user .msg-body {
    display: inline-block;
    padding: 12px 18px;
    border: 1px dashed var(--ink-25);
    background: var(--ink-12);
}
.msg.msg-ai .msg-body {
    padding-left: 18px;
    border-left: 2px solid var(--signal);
}
.msg-body p { margin: 0 0 10px; }
.msg-body p:last-child { margin-bottom: 0; }
.msg-body ul, .msg-body ol { margin: 6px 0 12px; padding-left: 22px; }
.msg-body li { margin: 4px 0; }
.msg-body h1, .msg-body h2, .msg-body h3 { margin: 14px 0 8px; line-height: 1.3; }
.msg-body h3 { font-size: 16px; }
.msg-body code {
    font-family: var(--font-mono); font-size: .88em;
    background: var(--ink-12); padding: 1px 6px;
}
.msg-body pre {
    margin: 10px 0;
    background: var(--ink); color: var(--paper);
    padding: 14px 16px; overflow-x: auto;
}
.msg-body pre code { background: none; padding: 0; color: inherit; font-size: 12.5px; line-height: 1.6; }
.msg-body strong { font-weight: 700; }
.msg-body blockquote {
    border-left: 2px solid var(--ink-25); padding-left: 14px;
    color: var(--ink-70); margin: 8px 0;
}

/* 推理纪要（Astra） */
.reasoning {
    margin: 2px 0 10px;
    border: 1px dotted var(--ink-25);
}
.reasoning summary {
    padding: 7px 12px; cursor: pointer;
    font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .14em;
    color: var(--ink-45);
    list-style: none;
    user-select: none;
}
.reasoning summary::-webkit-details-marker { display: none; }
.reasoning summary::before { content: '[ + ]'; margin-right: 8px; color: var(--signal); }
.reasoning[open] summary::before { content: '[ - ]'; }
.reasoning .r-body {
    padding: 4px 12px 11px 30px;
    font-family: var(--font-mono); font-size: 12px; line-height: 1.7;
    color: var(--ink-45);
    white-space: pre-wrap;
}

.typing-cursor {
    display: inline-block;
    width: .58em; height: 1.15em;
    background: var(--signal);
    vertical-align: text-bottom;
    margin-left: 2px;
    animation: blink .9s steps(1) infinite;
}

/* 生成等待 ASCII spinner */
.suspense {
    font-family: var(--font-mono); font-size: 13px; color: var(--signal);
    letter-spacing: .1em;
}
.wait-status {
    font-family: var(--font-mono); font-size: 12px; color: var(--ink-3, #888);
    letter-spacing: .02em; white-space: nowrap;
}

/* ============================================================
   输入区 + 档位拨杆 + X
   ============================================================ */
.composer {
    flex-shrink: 0;
    border-top: 1px solid var(--ink-25);
    padding: 14px 40px 16px;
    background: var(--paper);
}
.composer-inner { max-width: 860px; margin: 0 auto; }

/* ---------- 档位选择器 + X ---------- */
.level-dock {
    display: flex; align-items: center;
    gap: 12px;
    margin-bottom: 12px;
}
.level-track {
    position: relative;
    display: grid; grid-template-columns: repeat(3, 1fr);
    width: 360px; flex-shrink: 0;
    border: 1px solid var(--ink);
}
.level-pill {
    position: absolute; top: 0; bottom: 0; left: 0;
    width: 33.3334%;
    background: var(--ink);
    transition: transform .42s var(--ease-out);
    z-index: 0;
    overflow: hidden;
}
.level-track[data-level="l1"] .level-pill { transform: translateX(0); }
.level-track[data-level="l2"] .level-pill { transform: translateX(100%); }
.level-track[data-level="l3"] .level-pill { transform: translateX(200%); }
/* 切换瞬间的信号红扫描线 */
.level-pill::after {
    content: ''; position: absolute; inset: 0;
    background: var(--signal);
    transform: translateX(-101%);
}
.level-track.scan .level-pill::after { animation: scan .42s var(--ease-out); }
@keyframes scan {
    0%   { transform: translateX(-101%); }
    100% { transform: translateX(101%); }
}
.level-opt {
    position: relative; z-index: 1;
    padding: 10px 10px 9px;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-mono); font-size: 13.5px; font-weight: 500;
    letter-spacing: .14em;
    transition: color .3s var(--ease-out);
}
.level-opt[aria-checked="true"] { color: var(--paper); }
.level-opt:focus-visible { outline: 2px solid var(--signal); outline-offset: -2px; }

/* X：紧贴三档右侧，点击直接切换当前档位的高阶模型 */
.x-btn {
    flex-shrink: 0;
    width: 40px; height: 39px;
    border: 1px solid var(--ink-25);
    font-family: var(--font-mono); font-size: 15px; font-weight: 600;
    color: var(--ink-70);
    transition: color .25s, border-color .25s, box-shadow .25s, background .25s;
}
.x-btn:hover { border-color: var(--signal); color: var(--signal); }
.x-btn:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }
.x-btn.on {
    color: var(--signal);
    border-color: var(--signal);
    box-shadow: 0 0 0 1px var(--signal), 0 0 18px var(--signal-soft), 0 0 26px rgba(223,59,42,.25);
}

/* 模型选择按钮：接缝预留，暂留空（不接线） */
.pick-btn {
    flex-shrink: 0;
    width: 96px; height: 39px;
    border: 1px dashed var(--ink-25);
    transition: border-color .25s;
}
.pick-btn:disabled { cursor: not-allowed; }

/* 清空对话：贴右收口 */
.clear-btn {
    margin-left: auto;
    flex-shrink: 0;
    height: 39px;
    padding: 0 16px;
    border: 1px solid var(--ink-25);
    font-family: var(--font-mono); font-size: 12px; letter-spacing: .14em;
    color: var(--ink-70);
    transition: color .25s, border-color .25s, background .25s;
}
.clear-btn:hover { border-color: var(--signal); color: var(--signal); background: var(--signal-soft); }
.clear-btn:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }
.clear-btn:disabled { opacity: .32; cursor: not-allowed; }
.clear-btn:disabled:hover { border-color: var(--ink-25); color: var(--ink-70); background: none; }

/* ---------- 输入框 ---------- */
.input-row {
    display: flex; align-items: flex-end; gap: 12px;
    border: 1px solid var(--ink-25);
    background: var(--paper);
    padding: 10px 8px 10px 16px;
    transition: border-color .25s;
}
.input-row:focus-within { border-color: var(--ink); }
#input {
    flex: 1;
    resize: none; border: none; outline: none;
    background: transparent; color: var(--ink);
    font: inherit; font-size: 15px; line-height: 1.55;
    max-height: 160px;
    padding: 4px 0;
}
#input::placeholder { color: var(--ink-45); }

.send-btn {
    flex-shrink: 0;
    padding: 10px 20px;
    background: var(--ink); color: var(--paper);
    font-family: var(--font-mono); font-size: 12px; letter-spacing: .14em;
    border: 1px solid var(--ink);
    transition: background .3s var(--ease-out), color .3s var(--ease-out);
}
.send-btn:hover { background: transparent; color: var(--ink); }
.send-btn:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }
.send-btn.stop { background: var(--signal); border-color: var(--signal); color: #fff; }
.send-btn.stop:hover { background: transparent; color: var(--signal); }

/* ============================================================
   Astra 星域模式
   页面整体强制深空、与日夜主题脱钩。变量覆盖挂在 <html> 上：
   1) 首帧前 head 脚本即按会话档位写入 data-qs-astra，浏览器从未
      经历日夜色→星域色的切换，带颜色过渡的控件不会停在错色；
   2) color/background 在 body 处用 var() 解析后即以计算值向下
      继承，挂 :root 可同时覆盖显式 var() 与继承取色两类元素。
   页眉 .sh-root 只用自己的 --sh-* 令牌，不读这些变量，故不受
   影响，继续跟随页眉自己的日月切换。
   （body.qs-astra 由 JS 同步维护，只负责 canvas / composer 等
    外观微调规则，见下方各条。）
   ============================================================ */
:root[data-qs-astra="1"] {
    --paper: #05070f;
    --paper-deep: #080b16;
    --ink: #e8ecff;
    --ink-70: rgba(232, 236, 255, .74);
    --ink-45: rgba(232, 236, 255, .5);
    --ink-25: rgba(180, 196, 255, .24);
    --ink-12: rgba(180, 196, 255, .1);
    --signal: #ff5a4d;
    --signal-soft: rgba(255, 90, 77, .16);
}
body.qs-astra #rain { opacity: 1; }                       /* 流星层转为实背景 */
body.qs-astra .composer {
    background: rgba(7, 10, 20, .62);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
}
body.qs-astra .input-row { background: rgba(10, 14, 28, .66); }
body.qs-astra .level-pill { background: #e8ecff; }
body.qs-astra .level-opt[aria-checked="true"] { color: #05070f; }

/* 档位切换的两帧内，仅对参与变色的控件关闭过渡：自定义属性声明被
   【移除】（离开 Astra）时，Chromium 不会用回退后的日夜值重启动画，
   带 transition 的控件会停在星域旧色。拨杆滑块的 transform 滑动与
   扫描线 animation 不在此列，动作感原样保留（类由 JS 双 rAF 摘除）。 */
:root.qs-notrans .send-btn,
:root.qs-notrans .x-btn,
:root.qs-notrans .clear-btn,
:root.qs-notrans .level-opt,
:root.qs-notrans .input-row { transition: none !important; }

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>
<!-- 整屏背景层（字符雨 / 流星）由页面脚本挂载到 body（软导航换页时随之创建/移除） -->
<main class="app">
    <section class="stream" id="stream">
            <!-- 空状态 -->
            <div class="empty" id="empty">
                <div class="empty-inner">
                    <h1>确实<span class="slash">/</span>QUESHI</h1>
                </div>
            </div>
            <div class="stream-inner" id="streamInner" hidden></div>
        </section>

        <!-- ================= 输入区 ================= -->
        <footer class="composer">
            <div class="composer-inner">

                <!-- 档位 + 高阶模型直切开关 + 预留模型选择 + 清空对话 -->
                <div class="level-dock">
                    <div class="level-track" id="levelTrack" data-level="l2" role="radiogroup" aria-label="档位">
                        <div class="level-pill" aria-hidden="true"></div>
                        <button class="level-opt" type="button" role="radio" aria-checked="false" data-level="l1">Luna</button>
                        <button class="level-opt" type="button" role="radio" aria-checked="true" data-level="l2">Sol</button>
                        <button class="level-opt" type="button" role="radio" aria-checked="false" data-level="l3">Astra</button>
                    </div>
                    <button class="x-btn" id="xBtn" type="button" aria-pressed="false" title="X · 当前档位的高阶模型开关">X</button>
                    <button class="pick-btn" id="pickBtn" type="button" disabled aria-label="模型选择（待接入）" title="模型选择（待接入）"></button>
                    <button class="clear-btn" id="clearBtn" type="button" title="清空对话 (Ctrl+K)">清空对话</button>
                </div>

                <div class="input-row">
                    <textarea id="input" rows="1" placeholder="输入消息……"></textarea>
                    <button class="send-btn" id="sendBtn" type="button">SEND</button>
                </div>
            </div>
        </footer>
</main>

<!-- 全局页眉：LOGO / 导航 / 日月主题切换 / 可拖拽吸附顶底 -->
<script src="../components/site-header.js?v=20261015f"></script>
<!-- 页面清单：file:// 直开时供软导航取页（必须在软导航之前） -->
<script src="../components/page-manifest.js?v=20261015g"></script>
<!-- 软导航：与全站一致，页眉不重载、只换 <main> -->
<script src="../components/page-transit.js?v=20261015f"></script>
<!-- Luna：C(friso MMSEG) 编译的 wasm，全部在用户浏览器内运行，无后端。
     http(s) 静态部署：只取 luna.js，wasm/词典/模型走独立文件（可缓存）；
     file:// 直开：fetch 受限，改加载 base64 内联的 luna-assets.js。 -->
<script>
    (function () {
        var v = '20261015b';
        var files = location.protocol === 'file:'
            ? ['plugins/luna/luna-assets.js?v=' + v, 'plugins/luna/luna.js?v=' + v]
            : ['plugins/luna/luna.js?v=' + v];
        files.forEach(function (f) {
            var s = document.createElement('script');
            s.async = false;          /* 保序：assets 必须先于 luna.js */
            s.src = f;
            document.head.appendChild(s);
        });
    })();
</script>
<script data-page-script>
/* ============================================================
   QUESHI 确识 · 对话台逻辑（单对话）
   ============================================================ */
(function () {
    'use strict';

    var STORE_KEY = 'queshi-session-v2';
    var LEVELS = {
        l1: { name: 'Luna' },     /* 普通档 · 轻快 */
        l2: { name: 'Sol' },      /* 普通档 · 均衡 */
        l3: { name: 'Astra' }     /* 星域档 · 深研 */
    };

    /* ---------------- DOM ---------------- */
    var $ = function (s) { return document.querySelector(s); };
    var streamEl   = $('#stream');
    var innerEl    = $('#streamInner');
    var emptyEl    = $('#empty');
    var inputEl    = $('#input');
    var sendBtn    = $('#sendBtn');
    var trackEl    = $('#levelTrack');
    var xBtn       = $('#xBtn');
    var clearBtn   = $('#clearBtn');

    /* ---------------- 状态：只有一条对话 ---------------- */
    var session = load();
    var generating = false;
    var abortCtrl = null;
    var bgApi = null;

    function load() {
        try {
            var s = JSON.parse(localStorage.getItem(STORE_KEY));
            if (s && Array.isArray(s.msgs)) {
                return {
                    level: LEVELS[s.level] ? s.level : 'l2',
                    boost: !!s.boost,
                    msgs: s.msgs
                };
            }
        } catch (e) {}
        return { level: 'l2', boost: false, msgs: [] };
    }
    function save() {
        try { localStorage.setItem(STORE_KEY, JSON.stringify(session)); } catch (e) {}
    }

    /* ============================================================
       档位拨杆
       ============================================================ */
    function setLevel(level, animate) {
        if (!LEVELS[level]) return;
        session.level = level;
        trackEl.dataset.level = level;
        trackEl.querySelectorAll('.level-opt').forEach(function (b) {
            b.setAttribute('aria-checked', b.dataset.level === level ? 'true' : 'false');
        });
        /* Astra：页面整体强制星域，与页眉的日夜切换互不干涉。
           html 属性承载变量覆盖（首帧前由 head 脚本预置，运行期此处同步），
           body 类只供 canvas / composer 等外观微调规则使用。 */
        var astra = level === 'l3';
        /* 属性值必须保持 "1"：toggleAttribute(...,true) 只会写入空串，
           匹配不上 :root[data-qs-astra="1"]，故显式 set/remove */
        var rootEl = document.documentElement;
        /* 同一帧内摘除颜色过渡再改变量，两帧后恢复——避开 Chromium
           “移除自定义属性声明时旧色不回归”的过渡缺陷 */
        rootEl.classList.add('qs-notrans');
        if (astra) rootEl.setAttribute('data-qs-astra', '1');
        else rootEl.removeAttribute('data-qs-astra');
        document.body.classList.toggle('qs-astra', astra);
        requestAnimationFrame(function () {
            requestAnimationFrame(function () { rootEl.classList.remove('qs-notrans'); });
        });
        if (bgApi) bgApi.setMode(astra ? 'astra' : 'rain');
        if (animate) {
            trackEl.classList.remove('scan');
            void trackEl.offsetWidth;
            trackEl.classList.add('scan');
        }
        save();
    }

    trackEl.addEventListener('click', function (e) {
        var btn = e.target.closest('.level-opt');
        if (btn) setLevel(btn.dataset.level, true);
    });

    /* ============================================================
       X：当前档位的高阶模型开关（点击直接切换，无浮层）
       ============================================================ */
    function setBoost(on) {
        session.boost = !!on;
        xBtn.classList.toggle('on', session.boost);
        xBtn.setAttribute('aria-pressed', session.boost ? 'true' : 'false');
        save();
    }
    xBtn.addEventListener('click', function () { setBoost(!session.boost); });

    /* ============================================================
       消息渲染
       ============================================================ */
    function esc(s) {
        return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    /* 极简 Markdown：fence 代码块、行内 code/粗体/斜体、标题、列表、引用 */
    function markdown(src) {
        var fences = [];
        src = src.replace(/```[^\n]*\n?([\s\S]*?)```/g, function (m, code) {
            fences.push('<pre><code>' + esc(code.replace(/\n+$/, '')) + '</code></pre>');
            return '\u0000F' + (fences.length - 1) + '\u0000';
        });

        var lines = esc(src).split('\n');
        var out = [];
        var ul = false, ol = false, para = [];

        function inline(s) {
            return s
                .replace(/`([^`]+)`/g, '<code>$1</code>')
                .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
                .replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>');
        }
        function closePara() {
            if (para.length) { out.push('<p>' + para.join('<br>') + '</p>'); para = []; }
        }
        function closeLists() {
            if (ul) { out.push('</ul>'); ul = false; }
            if (ol) { out.push('</ol>'); ol = false; }
        }

        lines.forEach(function (raw) {
            var f = raw.match(/^\u0000F(\d+)\u0000$/);
            if (f) { closePara(); closeLists(); out.push(fences[+f[1]]); return; }
            if (/^\s*$/.test(raw)) { closePara(); closeLists(); return; }

            var h = raw.match(/^(#{1,3})\s+(.*)$/);
            if (h) { closePara(); closeLists(); out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>'); return; }

            var u = raw.match(/^\s*[-*]\s+(.*)$/);
            if (u) { closePara(); if (ol) { out.push('</ol>'); ol = false; } if (!ul) { out.push('<ul>'); ul = true; } out.push('<li>' + inline(u[1]) + '</li>'); return; }

            var o = raw.match(/^\s*\d+[.、]\s+(.*)$/);
            if (o) { closePara(); if (ul) { out.push('</ul>'); ul = false; } if (!ol) { out.push('<ol>'); ol = true; } out.push('<li>' + inline(o[1]) + '</li>'); return; }

            var q = raw.match(/^&gt;\s?(.*)$/);
            if (q) { closePara(); closeLists(); out.push('<blockquote>' + inline(q[1]) + '</blockquote>'); return; }

            closeLists();
            para.push(inline(raw));
        });
        closePara(); closeLists();
        return out.join('');
    }

    function syncClearBtn() {
        clearBtn.disabled = generating || !session.msgs.length;
    }

    function renderStream() {
        innerEl.innerHTML = '';
        if (!session.msgs.length) {
            emptyEl.hidden = false;
            innerEl.hidden = true;
            syncClearBtn();
            return;
        }
        emptyEl.hidden = true;
        innerEl.hidden = false;
        session.msgs.forEach(function (m) { innerEl.appendChild(buildMsg(m, false)); });
        streamEl.scrollTop = streamEl.scrollHeight;
        syncClearBtn();
    }

    function buildMsg(m, live) {
        var row = document.createElement('div');
        row.className = 'msg ' + (m.role === 'user' ? 'msg-user' : 'msg-ai');

        var meta = document.createElement('div');
        meta.className = 'msg-meta';
        var who = m.role === 'user' ? 'YOU' : 'QUESHI';
        meta.innerHTML =
            '<span class="who">' + who + '</span>' +
            (m.role === 'assistant' && m.level ? '<span class="stamp">' + m.level + '</span>' : '');
        row.appendChild(meta);

        var body = document.createElement('div');
        body.className = 'msg-body';

        if (m.role === 'assistant') {
            // 推理纪要容器：为空时隐藏，Astra 流式首个推理分片到达时再展开
            var det0 = document.createElement('details');
            det0.className = 'reasoning';
            det0.open = live;                 // 实时生成时展开，历史渲染时折叠
            if (!m.reasoning) det0.style.display = 'none';
            det0.innerHTML = '<summary>REASONING / 推理纪要</summary><div class="r-body"></div>';
            det0.querySelector('.r-body').textContent = m.reasoning || '';
            body.appendChild(det0);
        }

        var content = document.createElement('div');
        content.className = 'msg-content';
        content.innerHTML = m.content ? markdown(m.content) : '';
        body.appendChild(content);

        if (live) {
            var cur = document.createElement('span');
            cur.className = 'typing-cursor';
            cur.style.display = 'none';       // 首 token 到达前隐藏
            body.appendChild(cur);
        }
        row.appendChild(body);
        return row;
    }

    function nearBottom() {
        return streamEl.scrollHeight - streamEl.scrollTop - streamEl.clientHeight < 120;
    }

    /* ============================================================
       发送 & 流式接收
       ============================================================ */
    function send(text) {
        text = (text || '').trim();
        if (!text || generating) return;

        var userMsg = { role: 'user', content: text, ts: Date.now() };
        session.msgs.push(userMsg);
        save();

        // 首条消息：离开空状态
        if (session.msgs.length === 1) renderStream();
        else innerEl.appendChild(buildMsg(userMsg, false));
        streamEl.scrollTop = streamEl.scrollHeight;

        inputEl.value = '';
        autoGrow();

        var stampText = LEVELS[session.level].name.toUpperCase() + (session.boost ? '·X' : '');
        var aiMsg = { role: 'assistant', content: '', reasoning: '', level: stampText, ts: Date.now() };
        session.msgs.push(aiMsg);
        var row = buildMsg(aiMsg, true);
        innerEl.appendChild(row);
        var contentBox = row.querySelector('.msg-content');
        var reasoningBox = row.querySelector('.r-body');
        var reasoningWrap = row.querySelector('.reasoning');
        var cursor = row.querySelector('.typing-cursor');

        /* ASCII 等待动画，首个 token 到达后撤掉 */
        var waitRow = document.createElement('div');
        waitRow.className = 'msg-body';
        waitRow.innerHTML = '<span class="suspense">|</span>';
        row.appendChild(waitRow);
        var spinner = waitRow.querySelector('.suspense');
        var spinChars = ['|', '/', '-', '\\'];
        var si = 0;
        var spinTimer = setInterval(function () {
            si = (si + 1) % spinChars.length;
            spinner.textContent = spinChars[si];
        }, 110);

        startGenerating();
        abortCtrl = new AbortController();

        (async function () {
            try {
                var history = session.msgs
                    .filter(function (m) { return m !== aiMsg; })
                    .map(function (m) { return { role: m.role, content: m.content }; });

                var gotFirst = false;
                var gen = callModel(history, session.level, session.boost, abortCtrl.signal);
                var item;
                while (!(item = await gen.next()).done) {
                    var ev = item.value;
                    if (!gotFirst && ev.type !== 'status') {
                        gotFirst = true;
                        clearInterval(spinTimer);
                        waitRow.remove();
                        cursor.style.display = '';
                    }
                    if (ev.type === 'status') {
                        var st = waitRow.querySelector('.wait-status');
                        if (!st) {
                            st = document.createElement('span');
                            st.className = 'wait-status';
                            waitRow.appendChild(st);
                        }
                        st.textContent = ' ' + ev.text;
                        if (nearBottom()) streamEl.scrollTop = streamEl.scrollHeight;
                    } else if (ev.type === 'reasoning') {
                        aiMsg.reasoning += ev.text;
                        reasoningWrap.style.display = '';
                        reasoningBox.textContent = aiMsg.reasoning;
                        if (nearBottom()) streamEl.scrollTop = streamEl.scrollHeight;
                    } else if (ev.type === 'delta') {
                        aiMsg.content += ev.text;
                        contentBox.innerHTML = markdown(aiMsg.content);
                        if (cursor.parentElement !== contentBox.parentElement) {
                            contentBox.parentElement.appendChild(cursor);
                        }
                        if (nearBottom()) streamEl.scrollTop = streamEl.scrollHeight;
                    }
                }
            } catch (err) {
                if (waitRow.parentNode) waitRow.remove();
                if (cursor) cursor.style.display = '';
                aiMsg.content += '\n\n> [ERROR] ' + (err && err.message ? err.message : '信号中断');
                contentBox.innerHTML = markdown(aiMsg.content);
            } finally {
                clearInterval(spinTimer);
                if (waitRow.parentNode) waitRow.remove();
                if (cursor) cursor.remove();
                var det = row.querySelector('.reasoning');
                if (det && aiMsg.reasoning) det.open = false;   // 生成结束，推理纪要折叠
                save();
                stopGenerating();
                inputEl.focus();
            }
        })();
    }

    function clearChat() {
        if (generating) return;
        if (!session.msgs.length) return;
        session.msgs = [];
        save();
        renderStream();
        inputEl.focus();
    }
    clearBtn.addEventListener('click', clearChat);

    function startGenerating() {
        generating = true;
        sendBtn.classList.add('stop');
        sendBtn.textContent = 'STOP';
        syncClearBtn();
    }
    function stopGenerating() {
        generating = false;
        abortCtrl = null;
        sendBtn.classList.remove('stop');
        sendBtn.textContent = 'SEND';
        syncClearBtn();
    }

    sendBtn.addEventListener('click', function () {
        if (generating) { if (abortCtrl) abortCtrl.abort(); }
        else send(inputEl.value);
    });

    inputEl.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
            e.preventDefault();
            send(inputEl.value);
        }
    });
    function autoGrow() {
        inputEl.style.height = 'auto';
        inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + 'px';
    }
    inputEl.addEventListener('input', autoGrow);

    /* 快捷键（不展示在界面上；命名留存，软导航离开时摘除） */
    function onKeyDown(e) {
        if (e.altKey && /^[123]$/.test(e.key)) {
            e.preventDefault();
            setLevel('l' + e.key, true);
        }
        if ((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K')) {
            e.preventDefault();
            clearChat();
        }
    }
    document.addEventListener('keydown', onKeyDown);

    /* ============================================================
       模型路由（纯静态部署，零后端，全部在用户浏览器内运行）
         async function* callModel(history, level, boost, signal)
           - level 'l1' Luna：C(friso)→wasm 分词 + JS MKB2 多阶链，已接入
           - level 'l2' Sol / 'l3' Astra：未接入，直接回复“不可用”
           - boost：X 高阶模型；Luna 档为 emo8 八情感链（接缝已留，未装入）
       ============================================================ */
    /* ============================================================
       Luna（l1）：本地多阶混合马尔科夫链
       - MMSEG 分词在 wasm 内完成，生成与原生 markov_gen 位级一致
       - 引擎单例懒装载（首次切到 Luna 发问时装）
       - http(s)：fetch 独立 wasm/词典/模型文件；file://：base64 内联兜底
       - X 接缝：emo8 为 8 情感链大模型，等模型插件就位后，
         用 Luna.createEngine(wasm, dict, emo8Bytes) 装入并按 chain 选维，
         在此之前 X 开启时回落中性链并明示
       ============================================================ */
    var lunaEnginePromise = null;
    var lunaCallCount = 0;
    function ensureLuna(onStatus) {
        if (!window.Luna) return Promise.reject(new Error('Luna 脚本未载入'));
        if (!lunaEnginePromise) {
            lunaEnginePromise = window.Luna.loadDefault({
                log: function (m) { try { console.warn('[Luna] ' + m); } catch (e) {} },
                onProgress: onStatus
            }).catch(function (e) {
                lunaEnginePromise = null;
                throw e;
            });
        }
        return lunaEnginePromise;
    }

    function lunaStatusLabel(s) {
        if (s.phase === 'fallback') return '网络不稳，改走备用通道（约 8MB），请稍候…';
        if (s.phase === 'init') return '词典载入中…';
        var pct = Math.round((s.progress || 0) * 100);
        return '首次装载 Luna（约 1.8MB，只此一次）… ' + pct + '%';
    }

    async function* callLuna(text, boost, signal) {
        /* 装载阶段：引擎回调的进度实时透传给等待行；STOP 可中止等待 */
        var q = [];
        var waiter = null;
        function push(s) { if (waiter) { var w = waiter; waiter = null; w(s); } else q.push(s); }
        var p = ensureLuna(push);

        var engine = null;
        while (!engine) {
            var statusP = q.length ? Promise.resolve(q.shift())
                                   : new Promise(function (r) { waiter = r; });
            var win = await Promise.race([
                statusP.then(function (s) { return { status: s }; }),
                p.then(function (e) { return { engine: e }; },
                       function (e) { return { error: e }; }),
                new Promise(function (resolve) {
                    if (signal.aborted) resolve({ aborted: true });
                    else signal.addEventListener('abort', function () { resolve({ aborted: true }); });
                })
            ]);
            if (win.aborted) return;
            if (win.error) throw win.error;
            if (win.engine) { engine = win.engine; break; }
            yield { type: 'status', text: lunaStatusLabel(win.status) };
        }
        while (q.length) yield { type: 'status', text: lunaStatusLabel(q.shift()) };
        if (signal.aborted) return;

        if (boost) {
            /* emo8 接缝：大模型未到位，先回落中性链 */
            yield { type: 'delta', text: '〔X · emo8 高阶链尚未装入，本次由 Luna 中性链代答〕\n\n' };
            await sleep(220);
            if (signal.aborted) return;
        } else {
            await sleep(140);
        }

        var rngBase = (Date.now() ^ Math.imul(lunaCallCount++, 2654435761)) >>> 0;
        var r = engine.reply(text, { chain: 0, sample: 0, rngBase: rngBase });
        if (!r.tokens.length) {
            yield { type: 'delta', text: '……' };
            return;
        }
        for (var i = 0; i < r.tokens.length; i++) {
            if (signal.aborted) return;
            yield { type: 'delta', text: r.tokens[i] };
            /* 动作感：按 token 长度微调节奏，标点不停顿 */
            var pause = /[，。！？：；、,.!?;:]/.test(r.tokens[i]) ? 26 : 52;
            await sleep(pause + Math.min(90, r.tokens[i].length * 14));
        }
    }

    async function* callModel(history, level, boost, signal) {
        var lastUser = '';
        for (var i = history.length - 1; i >= 0; i--) {
            if (history[i].role === 'user') { lastUser = history[i].content; break; }
        }

        /* Luna 档：本地真实生成（C wasm 分词 + 多阶链，全程用户端运行） */
        if (level === 'l1') {
            yield* callLuna(lastUser, boost, signal);
            return;
        }

        /* Sol / Astra：模型尚未接入，直接告知不可用，不做假回复 */
        var unavailable = {
            l2: '〔Sol 档暂不可用〕\n\n该模型尚未接入。当前只有 Luna 档可用——分词与生成全部在你本地浏览器内完成，请把档位拨到 **Luna**。',
            l3: '〔Astra 档暂不可用〕\n\n星域深研模型尚未接入。当前只有 Luna 档可用——分词与生成全部在你本地浏览器内完成，请把档位拨到 **Luna**。'
        };
        yield { type: 'delta', text: unavailable[level] || '〔该档位暂不可用〕' };
    }

    function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

    /* ============================================================
       整屏背景引擎（fixed canvas，软导航离开时整块移除）
       - rain  ：Luna / Sol，极淡字符雨，跟随日夜
       - astra ：Astra，整片深空流星，与日夜脱钩
       ============================================================ */
    function startBackground() {
        var canvas = document.createElement('canvas');
        canvas.id = 'rain';
        canvas.setAttribute('aria-hidden', 'true');
        document.body.appendChild(canvas);

        var ctx = canvas.getContext('2d');
        var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
        var mode = session.level === 'l3' ? 'astra' : 'rain';
        var raf = 0;
        var W = 0, H = 0;

        /* 字符雨状态 */
        var CHARS = '确识QUESHI01アイウエオ<>/\\|[]{}=+*#$%&!?';
        var fontSize = 16, cols = 0, drops = [];

        /* 星域状态 */
        var stars = [], meteors = [], nextMeteorAt = 0;

        function cssVar(name) {
            return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
        }
        function buildRain() {
            cols = Math.floor(W / fontSize);
            drops = [];
            for (var i = 0; i < cols; i++) drops[i] = Math.random() * -40;
        }
        function buildStars() {
            stars = [];
            var n = Math.round(W * H / 9000);
            for (var i = 0; i < n; i++) {
                stars.push({
                    x: Math.random() * W, y: Math.random() * H,
                    r: Math.random() * 1.2 + .3,
                    ph: Math.random() * Math.PI * 2,
                    sp: .4 + Math.random() * 1.4
                });
            }
            meteors = [];
            nextMeteorAt = 0;
        }
        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
            buildRain();
            buildStars();
            paintBase(true);
        }

        function paintBase(opaque) {
            if (mode === 'astra') {
                ctx.globalAlpha = 1;
                ctx.fillStyle = '#05070f';
                ctx.fillRect(0, 0, W, H);
            } else if (opaque) {
                ctx.globalAlpha = 1;
                ctx.fillStyle = cssVar('--paper');
                ctx.fillRect(0, 0, W, H);
            }
        }

        /* ---------------- 字符雨 ---------------- */
        function drawRain() {
            ctx.globalAlpha = .12;
            ctx.fillStyle = cssVar('--paper');
            ctx.fillRect(0, 0, W, H);
            ctx.globalAlpha = 1;
            ctx.fillStyle = cssVar('--ink');
            ctx.font = fontSize + 'px "IBM Plex Mono", monospace';
            for (var i = 0; i < drops.length; i++) {
                var ch = CHARS[Math.floor(Math.random() * CHARS.length)];
                ctx.fillText(ch, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > H && Math.random() > .975) drops[i] = 0;
                drops[i]++;
            }
        }

        /* ---------------- 流星 ---------------- */
        function spawnMeteor() {
            var speed = 8 + Math.random() * 6;
            var ang = .32 + Math.random() * .16;          /* 斜向右下 */
            meteors.push({
                x: Math.random() * W * .9 - 100,
                y: -60 + Math.random() * H * .35,
                vx: speed,
                vy: speed * ang,
                len: 140 + Math.random() * 140,
                w: .8 + Math.random() * 1.1
            });
        }
        function drawAstra(t) {
            /* 深空拖尾渐隐 */
            ctx.globalAlpha = 1;
            ctx.fillStyle = 'rgba(5, 7, 15, .28)';
            ctx.fillRect(0, 0, W, H);

            /* 星点闪烁 */
            for (var i = 0; i < stars.length; i++) {
                var s = stars[i];
                var a = .25 + .55 * (.5 + .5 * Math.sin(t * .001 * s.sp + s.ph));
                ctx.globalAlpha = a;
                ctx.fillStyle = '#dce6ff';
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;

            /* 随机生成流星 */
            if (!reduce && t > nextMeteorAt) {
                spawnMeteor();
                nextMeteorAt = t + 420 + Math.random() * 1500;
            } else if (reduce && !meteors.length) {
                spawnMeteor();                               /* 降动态：只留一颗静帧 */
            }

            for (var k = meteors.length - 1; k >= 0; k--) {
                var m = meteors[k];
                var norm = Math.sqrt(m.vx * m.vx + m.vy * m.vy);
                var ux = m.vx / norm, uy = m.vy / norm;
                var tx = m.x - ux * m.len, ty = m.y - uy * m.len;
                var g = ctx.createLinearGradient(m.x, m.y, tx, ty);
                g.addColorStop(0, 'rgba(255,255,255,.95)');
                g.addColorStop(.25, 'rgba(190,210,255,.5)');
                g.addColorStop(1, 'rgba(120,150,255,0)');
                ctx.strokeStyle = g;
                ctx.lineWidth = m.w;
                ctx.beginPath();
                ctx.moveTo(m.x, m.y);
                ctx.lineTo(tx, ty);
                ctx.stroke();

                if (!reduce) { m.x += m.vx; m.y += m.vy; }
                if (m.y - m.len > H || m.x - m.len > W) meteors.splice(k, 1);
            }
        }

        function frame(t) {
            if (mode === 'astra') drawAstra(t || 0);
            else drawRain();
            raf = requestAnimationFrame(frame);
        }

        function setMode(next) {
            if (next === mode) return;
            mode = next;
            meteors = [];
            nextMeteorAt = 0;
            paintBase(true);                               /* 模式切换：清掉上一种画面残影 */
        }

        resize();
        window.addEventListener('resize', resize);
        if (reduce) frame(0);
        else raf = requestAnimationFrame(frame);

        return {
            setMode: setMode,
            stop: function () {
                cancelAnimationFrame(raf);
                window.removeEventListener('resize', resize);
                if (canvas.parentNode) canvas.parentNode.removeChild(canvas);
            }
        };
    }

    /* body.sh-dock-bottom 由页眉组件（site-header.js）统一维护，
       本页 CSS 直接据此做安全区避让，无需自己观察 */

    /* ---------------- 启动 ---------------- */
    bgApi = startBackground();
    setBoost(session.boost);
    setLevel(session.level, false);
    renderStream();

    /* 软导航离开本页：停背景引擎、摘监听、还原星域状态，避免空转与污染 */
    window.__optionextPageStop = function () {
        if (bgApi) { bgApi.stop(); bgApi = null; }
        document.removeEventListener('keydown', onKeyDown);
        document.documentElement.removeAttribute('data-qs-astra');
        document.body.classList.remove('qs-astra');
        if (abortCtrl) abortCtrl.abort();
    };
})();
</script>
</body>
</html>
