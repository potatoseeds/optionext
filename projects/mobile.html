<!DOCTYPE html>
<html lang="zh-CN" data-flavor="mob">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Optionext · 项目</title>
    <script src="../components/device-guard.js"></script>
    <script>
        /* 主题防闪烁：早于一切渲染确定“明 / 暗”另一半 */
        (function () {
            try {
                var t = localStorage.getItem('optionext-theme') ||
                    (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                document.documentElement.dataset.theme = t;
            } catch (e) {}
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style data-page="projects">
        /* ============================================================
           OPTIONEXT · 项目页（移动）· 纯内容页
           无字符矩阵 / 无点阵：矩阵品牌秀只属于主页；本页只承载项目
           ============================================================ */
        :root {
            --paper: #f4f3ef;
            --ink: #141310;
            --ink-rgb: 20, 19, 16;
            --ink-70: rgba(20, 19, 16, .72);
            --ink-45: rgba(20, 19, 16, .42);
            --ink-25: rgba(20, 19, 16, .22);
            --signal: #df3b2a;
            --font-sans: "Space Grotesk", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
            --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
            --ease-out: cubic-bezier(.22, 1, .36, 1);
        }

        :root[data-theme="dark"] {
            --paper: #0f0e0c;
            --ink: #e9e7e1;
            --ink-rgb: 233, 231, 225;
            --ink-70: rgba(233, 231, 225, .72);
            --ink-45: rgba(233, 231, 225, .45);
            --ink-25: rgba(233, 231, 225, .22);
            --signal: #ef4d3a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { -webkit-text-size-adjust: 100%; }

        body {
            background: var(--paper);
            color: var(--ink);
            font-family: var(--font-sans);
            font-size: 16px;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        ::selection { background: var(--ink); color: var(--paper); }
        a { color: inherit; text-decoration: none; }

        .mono {
            font-family: var(--font-mono);
            font-size: 10.5px;
            letter-spacing: .14em;
            text-transform: uppercase;
            color: var(--ink-70);
        }

        /* ============================================================
           页面骨架（底部为固定 tabbar 预留空间）
           ============================================================ */
        .page {
            padding: 56px 24px calc(108px + env(safe-area-inset-bottom));
        }
        .page-inner { max-width: 520px; margin: 0 auto; }

        .page-head { margin-bottom: 36px; }
        .page-head .kicker {
            display: block;
            margin-bottom: 12px;
            opacity: 0;
            animation: rise .7s var(--ease-out) .1s forwards;
        }
        .page-head h1 {
            font-size: 28px;
            font-weight: 700;
            line-height: 1.15;
            letter-spacing: .01em;
            opacity: 0;
            animation: rise .7s var(--ease-out) .22s forwards;
        }
        .page-head h1 .dot {
            color: var(--signal);
            font-family: var(--font-mono);
            font-weight: 400;
        }

        /* ============================================================
           项目索引：实线顶 + 虚线档案行（移动端纵向堆叠）
           ============================================================ */
        .registry {
            border-top: 1px solid var(--ink-25);
            opacity: 0;
            animation: rise .7s var(--ease-out) .34s forwards;
        }

        /* 空状态：药柜尚空（有项目后整段移除即可） */
        .registry-empty {
            padding: 24px 2px;
            border-bottom: 1px dotted var(--ink-25);
        }
        .registry-empty .re-tag {
            display: block;
            margin-bottom: 9px;
            color: var(--ink-45);
        }
        .registry-empty .re-text {
            font-size: 16px;
            line-height: 1.85;
            letter-spacing: .02em;
            color: var(--ink-45);
        }

        /* 项目行：新增项目时按 HTML 注释模板复制启用（触屏箭头常显） */
        .proj-row {
            display: block;
            padding: 24px 2px;
            border-bottom: 1px dotted var(--ink-25);
            color: var(--ink);
        }
        .proj-row .proj-meta {
            display: block;
            font-family: var(--font-mono);
            font-size: 10.5px;
            letter-spacing: .14em;
            color: var(--signal);
            margin-bottom: 9px;
        }
        .proj-row .proj-meta .idx {
            color: var(--ink-45);
            margin-right: 9px;
        }
        .proj-row h3 {
            display: inline;
            font-size: 16px;
            font-weight: 500;
            line-height: 1.85;
            letter-spacing: .02em;
        }
        .proj-row .proj-arrow {
            font-family: var(--font-mono);
            color: var(--ink-45);
            margin-left: 8px;
        }
        .proj-row:active h3 { color: var(--signal); }
        .proj-row:focus-visible {
            outline: 2px solid var(--signal);
            outline-offset: 3px;
        }

        /* ============================================================
           新闻板块（移动）：点开抽屉，iframe 直接载入 news/<n>.html，
           地址栏同步 ?PG=<n>
           ============================================================ */
        .news-head {
            display: block;
            position: relative;
            width: 100%;
            padding: 23px 30px 23px 2px;
            background: none;
            border: 0;
            font: inherit;
            color: var(--ink);
            text-align: left;
        }
        .news-head .news-meta {
            display: block;
            font-family: var(--font-mono);
            font-size: 10.5px;
            letter-spacing: .14em;
            color: var(--signal);
            margin-bottom: 9px;
        }
        .news-head .news-meta .idx {
            color: var(--ink-45);
            margin-right: 9px;
        }
        .news-head .news-title {
            font-size: 16px;
            font-weight: 500;
            line-height: 1.8;
            letter-spacing: .02em;
            transition: color .3s var(--ease-out);
        }
        .news-head .news-mark {
            position: absolute;
            right: 2px;
            top: 26px;
            font-family: var(--font-mono);
            font-size: 18px;
            line-height: 1;
            color: var(--ink-45);
            transform: rotate(0deg);
            transform-origin: 50% 45%;
            transition: transform .45s var(--ease-out), color .3s var(--ease-out);
        }
        .news-head:active .news-title { color: var(--signal); }
        .news.is-open .news-title { color: var(--signal); }
        .news.is-open .news-mark { color: var(--signal); transform: rotate(135deg); }
        .news-head:focus-visible {
            outline: 2px solid var(--signal);
            outline-offset: 3px;
        }

        /* 抽屉：grid 行高 0fr → 1fr 实现高度自动的展开动画 */
        .news-panel {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows .52s var(--ease-out);
        }
        .news.is-open .news-panel { grid-template-rows: 1fr; }
        .news-panel-inner { min-height: 0; overflow: hidden; }
        .news-drawer {
            opacity: 0;
            transform: translateY(-10px);
            transition: opacity .42s var(--ease-out) .06s,
                        transform .42s var(--ease-out) .06s;
            padding: 0 2px 30px;
        }
        .news.is-open .news-drawer { opacity: 1; transform: none; }

        /* 匣子：左缘信号红线；未取到子文档高度前显示“载入中” */
        .news-frame-box {
            position: relative;
            min-height: 170px;
            border: 1px solid var(--ink-25);
            border-left: 2px solid var(--signal);
            background: var(--paper);
        }
        .news-frame-box.is-fit { min-height: 0; }
        .news-frame-hint {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity .3s ease, visibility .3s ease;
        }
        .news-frame-box.is-fit .news-frame-hint { opacity: 0; visibility: hidden; }
        .news-frame-hint { white-space: normal; line-height: 1.7; text-align: center; padding: 0 16px; }
        .news-frame-hint.is-error {
            color: var(--signal);
            text-transform: none;
            font-family: var(--font-sans);
            font-size: 13px;
            letter-spacing: .02em;
        }

        /* 部署自检：抽屉脚本漏传 / 被拦截时，替代“点了没反应”的显性提示 */
        .news-fatal {
            margin: 8px 0;
            padding: 16px;
            border: 1px solid var(--signal);
            border-left-width: 3px;
            color: var(--signal);
            font-size: 13.5px;
            line-height: 1.8;
            letter-spacing: .02em;
        }
        .news-frame {
            display: block;
            width: 100%;
            height: 0;
            min-height: 0;
            border: 0;
            background: var(--paper);
            opacity: 0;
            transition: opacity .4s var(--ease-out);
        }
        .news-frame-box.is-fit .news-frame { opacity: 1; }

        @keyframes rise {
            from { opacity: 0; transform: translateY(18px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .001ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: .001ms !important;
            }
            .page-head .kicker, .page-head h1, .registry { opacity: 1 !important; }
        }
    </style>
</head>
<body>
    <main class="page">
        <div class="page-inner">
            <header class="page-head">
                <span class="kicker mono">02</span>
                <h1>项目<span class="dot">.</span></h1>
            </header>

            <div class="registry">
                <!-- —— 项目行模板：新增“整页项目”时取消注释并按行复制 ——
                <a class="proj-row" href="#">
                    <span class="proj-meta"><span class="idx">01</span>进行中</span>
                    <h3>项目名称</h3><span class="proj-arrow" aria-hidden="true">→</span>
                </a>
                -->

                <!-- —— 新闻板块：点开在原位展开抽屉，iframe 直接载入 news/<n>.html。
                     新增新闻：复制整段 .news、改 data-pg / data-src / 标题即可，
                     ?PG=<n> 会自动与该板块对应 —— -->
                <section class="news" data-pg="1">
                    <button class="news-head" type="button"
                            aria-expanded="false" aria-controls="news-panel-1">
                        <span class="news-meta"><span class="idx">01</span>2026.10.14 · TEST</span>
                        <span class="news-title">测试新闻 · 壹：案牍集的匣子开张了</span>
                        <span class="news-mark" aria-hidden="true">+</span>
                    </button>
                    <div class="news-panel" id="news-panel-1">
                        <div class="news-panel-inner">
                            <div class="news-drawer">
                                <div class="news-frame-box">
                                    <span class="news-frame-hint mono">载入中</span>
                                    <iframe class="news-frame" title="测试新闻 · 壹"
                                            data-src="news/1.html" loading="lazy"></iframe>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>

                <section class="news" data-pg="2">
                    <button class="news-head" type="button"
                            aria-expanded="false" aria-controls="news-panel-2">
                        <span class="news-meta"><span class="idx">02</span>2026.10.14 · TEST</span>
                        <span class="news-title">测试新闻 · 贰：抽屉使用说明（长文测试）</span>
                        <span class="news-mark" aria-hidden="true">+</span>
                    </button>
                    <div class="news-panel" id="news-panel-2">
                        <div class="news-panel-inner">
                            <div class="news-drawer">
                                <div class="news-frame-box">
                                    <span class="news-frame-hint mono">载入中</span>
                                    <iframe class="news-frame" title="测试新闻 · 贰"
                                            data-src="news/2.html" loading="lazy"></iframe>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <script src="../components/mobile-tabbar.js?v=20261014d"></script>
    <!-- 新闻板块抽屉：?PG=n 追踪 + iframe 载入（必须在软导航之前） -->
    <script src="../components/news-drawer.js?v=20261014c"></script>
    <script data-page-script>window.OptionextNewsDrawer()</script>
    <!-- 部署自检：脚本漏传 / 被拦截时给出显性红条，而不是“点了没反应” -->
    <script>
        window.addEventListener('load', function () {
            setTimeout(function () {
                if (typeof window.OptionextNewsDrawer === 'function') return;
                var box = document.querySelector('.registry');
                if (!box || box.querySelector('.news-fatal')) return;
                var d = document.createElement('div');
                d.className = 'news-fatal';
                d.textContent = '板块脚本未加载：components/news-drawer.js 缺失或被拦截。' +
                    '云端部署请整目录覆盖上传；本地请强制刷新（Ctrl+Shift+R / 手机端清缓存）后重试。';
                box.parentNode.insertBefore(d, box);
            }, 300);
        });
    </script>
    <!-- 页面清单：file:// 直开时供软导航取页（必须在软导航之前） -->
    <script src="../components/page-manifest.js?v=20261014d"></script>
    <!-- 软导航：底栏保活 + 主体淡入淡出（必须在底栏组件之后） -->
    <script src="../components/page-transit.js?v=20261014b"></script>
</body>
</html>
