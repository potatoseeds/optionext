<!DOCTYPE html>
<html lang="zh-CN" data-flavor="desk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Optionext · 项目</title>
    <link rel="icon" type="image/png" href="../images/LOGO竖版.png">
    <script>
        /* 主题防闪烁：早于一切渲染确定“明 / 暗”另一半 */
        (function () {
            try {
                var t = localStorage.getItem('optionext-theme') ||
                    (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                document.documentElement.dataset.theme = t;
            } catch (e) {}
        })();
    </script>
    <script src="../components/device-guard.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style data-page="projects">
        /* ============================================================
           OPTIONEXT · 项目页（桌面）· 纯内容页
           无字符矩阵 / 无点阵：矩阵品牌秀只属于主页；本页只承载项目
           ============================================================ */
        :root {
            --paper: #f4f3ef;
            --ink: #141310;
            --ink-rgb: 20, 19, 16;
            --ink-70: rgba(20, 19, 16, .72);
            --ink-45: rgba(20, 19, 16, .42);
            --ink-25: rgba(20, 19, 16, .22);
            --signal: #df3b2a;
            --font-sans: "Space Grotesk", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
            --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
            --ease-out: cubic-bezier(.22, 1, .36, 1);
            /* 页眉顶 / 底吸附安全区：玻璃底边约在 72px（top 14 + 条高 ~58），
               上下各加呼吸距；沉底时顶部只需普通页边距 */
            --sh-safe-top: 104px;
            --sh-safe-bottom: 112px;
            --sh-clear: 44px;
        }

        :root[data-theme="dark"] {
            --paper: #0f0e0c;
            --ink: #e9e7e1;
            --ink-rgb: 233, 231, 225;
            --ink-70: rgba(233, 231, 225, .72);
            --ink-45: rgba(233, 231, 225, .45);
            --ink-25: rgba(233, 231, 225, .22);
            --signal: #ef4d3a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { -webkit-text-size-adjust: 100%; }

        body {
            background: var(--paper);
            color: var(--ink);
            font-family: var(--font-sans);
            font-size: 16px;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        ::selection { background: var(--ink); color: var(--paper); }
        a { color: inherit; text-decoration: none; }

        .mono {
            font-family: var(--font-mono);
            font-size: 11px;
            letter-spacing: .14em;
            text-transform: uppercase;
            color: var(--ink-70);
        }

        /* ============================================================
           页面骨架 + 页眉顶 / 底吸附避让（与确实页同一机制）
           · 锚顶：顶部留安全距，标题不被玻璃压住（较旧版 132 小幅收紧）；
           · 沉底：安全距挪到底部，顶部只留普通页边距。
           padding 以 .5s 缓出双向过渡，与玻璃吸附飞行（~.62s）对齐；
           transition 同时包含软导航淡入淡出属性。
           ============================================================ */
        .page {
            padding: var(--sh-safe-top) clamp(28px, 5vw, 72px) 104px;
            transition: padding .5s var(--ease-out), opacity .24s ease, transform .24s ease;
        }
        body.sh-dock-bottom .page {
            padding-top: var(--sh-clear);
            padding-bottom: var(--sh-safe-bottom);
        }
        .page-inner { max-width: 1120px; margin: 0 auto; }

        .page-head { margin-bottom: 54px; }
        .page-head .kicker {
            display: block;
            margin-bottom: 16px;
            opacity: 0;
            animation: rise .7s var(--ease-out) .1s forwards;
        }
        .page-head h1 {
            font-size: clamp(30px, 3.2vw, 44px);
            font-weight: 700;
            line-height: 1.15;
            letter-spacing: -.01em;
            opacity: 0;
            animation: rise .7s var(--ease-out) .22s forwards;
        }
        .page-head h1 .dot {
            color: var(--signal);
            font-family: var(--font-mono);
            font-weight: 400;
        }

        /* ============================================================
           项目索引：实线顶 + 虚线档案行（与主页台账同构）
           ============================================================ */
        .registry {
            border-top: 1px solid var(--ink-25);
            opacity: 0;
            animation: rise .7s var(--ease-out) .34s forwards;
        }

        /* 空状态：药柜尚空（有项目后整段移除即可） */
        .registry-empty {
            display: grid;
            grid-template-columns: 190px 1fr;
            gap: clamp(24px, 4vw, 72px);
            align-items: baseline;
            padding: 28px 8px;
            border-bottom: 1px dotted var(--ink-25);
        }
        .registry-empty .re-tag { color: var(--ink-45); }
        .registry-empty .re-text {
            font-size: 17px;
            line-height: 1.85;
            letter-spacing: .02em;
            color: var(--ink-45);
        }

        /* 项目行：新增项目时按 HTML 注释模板复制启用 */
        .proj-row {
            display: grid;
            grid-template-columns: 190px 1fr auto;
            gap: clamp(24px, 4vw, 72px);
            align-items: baseline;
            padding: 27px 8px;
            border-bottom: 1px dotted var(--ink-25);
            color: var(--ink);
        }
        .proj-row .proj-meta {
            font-family: var(--font-mono);
            font-size: 11px;
            letter-spacing: .14em;
            color: var(--signal);
        }
        .proj-row .proj-meta .idx {
            color: var(--ink-45);
            margin-right: 12px;
        }
        .proj-row h3 {
            font-size: 17px;
            font-weight: 500;
            line-height: 1.85;
            letter-spacing: .02em;
            transition: color .3s var(--ease-out);
        }
        .proj-row .proj-arrow {
            font-family: var(--font-mono);
            color: var(--ink-45);
            opacity: 0;
            transform: translateX(-6px);
            transition: opacity .3s var(--ease-out), transform .3s var(--ease-out);
        }
        @media (hover: hover) {
            .proj-row:hover h3 { color: var(--signal); }
            .proj-row:hover .proj-arrow { opacity: 1; transform: translateX(0); }
        }
        .proj-row:focus-visible {
            outline: 2px solid var(--signal);
            outline-offset: 3px;
        }

        /* ============================================================
           新闻板块：档案行可点开，抽屉在原位展开，iframe 直接载入
           对应 projects/news/<n>.html，地址栏同步 ?PG=<n>
           ============================================================ */
        .news-head {
            display: grid;
            grid-template-columns: 190px 1fr auto;
            gap: clamp(24px, 4vw, 72px);
            align-items: baseline;
            width: 100%;
            padding: 27px 8px;
            background: none;
            border: 0;
            font: inherit;
            color: var(--ink);
            text-align: left;
            cursor: pointer;
        }
        .news-head .news-meta {
            font-family: var(--font-mono);
            font-size: 11px;
            letter-spacing: .14em;
            color: var(--signal);
        }
        .news-head .news-meta .idx {
            color: var(--ink-45);
            margin-right: 12px;
        }
        .news-head .news-title {
            font-size: 17px;
            font-weight: 500;
            line-height: 1.85;
            letter-spacing: .02em;
            transition: color .3s var(--ease-out);
        }
        .news-head .news-mark {
            font-family: var(--font-mono);
            font-size: 19px;
            line-height: 1;
            color: var(--ink-45);
            transform: rotate(0deg);
            transform-origin: 50% 45%;
            transition: transform .45s var(--ease-out), color .3s var(--ease-out);
        }
        @media (hover: hover) {
            .news-head:hover .news-title { color: var(--signal); }
            .news-head:hover .news-mark { color: var(--signal); transform: rotate(90deg); }
        }
        .news-head:active .news-title { color: var(--signal); }
        .news.is-open .news-title { color: var(--signal); }
        .news.is-open .news-mark { color: var(--signal); transform: rotate(135deg); }
        .news-head:focus-visible {
            outline: 2px solid var(--signal);
            outline-offset: 3px;
        }

        /* 抽屉：grid 行高 0fr → 1fr 实现高度自动的展开动画 */
        .news-panel {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows .52s var(--ease-out);
        }
        .news.is-open .news-panel { grid-template-rows: 1fr; }
        .news-panel-inner { min-height: 0; overflow: hidden; }
        .news-drawer {
            opacity: 0;
            transform: translateY(-10px);
            transition: opacity .42s var(--ease-out) .06s,
                        transform .42s var(--ease-out) .06s;
            padding: 0 8px 36px;
        }
        .news.is-open .news-drawer { opacity: 1; transform: none; }

        /* 匣子：左缘信号红线；未取到子文档高度前显示“载入中” */
        .news-frame-box {
            position: relative;
            min-height: 190px;
            border: 1px solid var(--ink-25);
            border-left: 2px solid var(--signal);
            background: var(--paper);
            transition: min-height .3s var(--ease-out);
        }
        .news-frame-box.is-fit { min-height: 0; }
        .news-frame-hint {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity .3s ease, visibility .3s ease;
        }
        .news-frame-box.is-fit .news-frame-hint { opacity: 0; visibility: hidden; }
        .news-frame-hint { white-space: normal; line-height: 1.7; text-align: center; padding: 0 20px; }
        .news-frame-hint.is-error {
            color: var(--signal);
            text-transform: none;
            font-family: var(--font-sans);
            font-size: 13.5px;
            letter-spacing: .02em;
        }

        /* 部署自检：抽屉脚本漏传 / 被拦截时，替代“点了没反应”的显性提示 */
        .news-fatal {
            margin: 8px 0;
            padding: 18px 20px;
            border: 1px solid var(--signal);
            border-left-width: 3px;
            color: var(--signal);
            font-size: 14px;
            line-height: 1.8;
            letter-spacing: .02em;
        }
        .news-frame {
            display: block;
            width: 100%;
            height: 0;
            min-height: 0;
            border: 0;
            background: var(--paper);
            opacity: 0;
            transition: opacity .4s var(--ease-out);
        }
        .news-frame-box.is-fit .news-frame { opacity: 1; }

        @keyframes rise {
            from { opacity: 0; transform: translateY(18px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .001ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: .001ms !important;
            }
            .page-head .kicker, .page-head h1, .registry { opacity: 1 !important; }
        }

        /* 窄屏兜底（站点以 PC 为主，移动端由 guard 跳转） */
        @media (max-width: 1080px) {
            .registry-empty, .proj-row { grid-template-columns: 1fr; gap: 10px; padding: 22px 4px; }
            .news-head { grid-template-columns: 1fr; gap: 9px; padding: 22px 4px; }
            .news-drawer { padding: 0 4px 28px; }
        }
    </style>
</head>
<body>
    <main class="page">
        <div class="page-inner">
            <header class="page-head">
                <span class="kicker mono">02 / PROJECTS</span>
                <h1>项目<span class="dot">.</span></h1>
            </header>

            <div class="registry">
                <!-- —— 项目行模板：新增“整页项目”时取消注释并按行复制 ——
                <a class="proj-row" href="#">
                    <span class="proj-meta"><span class="idx">01</span>2026 · ACTIVE</span>
                    <h3>项目名称</h3>
                    <span class="proj-arrow" aria-hidden="true">→</span>
                </a>
                -->

                <!-- —— 新闻板块：点开在原位展开抽屉，iframe 直接载入 news/<n>.html。
                     新增新闻：复制整段 .news、改 data-pg / data-src / 标题即可，
                     ?PG=<n> 会自动与该板块对应 —— -->
                <section class="news" data-pg="1">
                    <button class="news-head" type="button"
                            aria-expanded="false" aria-controls="news-panel-1">
                        <span class="news-meta"><span class="idx">01</span>2026.10.14 · TEST</span>
                        <span class="news-title">测试新闻 · 壹：案牍集的匣子开张了</span>
                        <span class="news-mark" aria-hidden="true">+</span>
                    </button>
                    <div class="news-panel" id="news-panel-1">
                        <div class="news-panel-inner">
                            <div class="news-drawer">
                                <div class="news-frame-box">
                                    <span class="news-frame-hint mono">载入中 · LOADING</span>
                                    <iframe class="news-frame" title="测试新闻 · 壹"
                                            data-src="news/1.html" loading="lazy"></iframe>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>

                <section class="news" data-pg="2">
                    <button class="news-head" type="button"
                            aria-expanded="false" aria-controls="news-panel-2">
                        <span class="news-meta"><span class="idx">02</span>2026.10.14 · TEST</span>
                        <span class="news-title">测试新闻 · 贰：抽屉使用说明（长文测试）</span>
                        <span class="news-mark" aria-hidden="true">+</span>
                    </button>
                    <div class="news-panel" id="news-panel-2">
                        <div class="news-panel-inner">
                            <div class="news-drawer">
                                <div class="news-frame-box">
                                    <span class="news-frame-hint mono">载入中 · LOADING</span>
                                    <iframe class="news-frame" title="测试新闻 · 贰"
                                            data-src="news/2.html" loading="lazy"></iframe>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <script src="../components/site-header.js?v=20261015f"></script>
    <!-- 新闻板块抽屉：?PG=n 追踪 + iframe 载入（必须在软导航之前） -->
    <script src="../components/news-drawer.js?v=20261015f"></script>
    <script data-page-script>
    /* 硬加载时上面的外链已定义函数；从其它栏目经软导航进入本页时，
       page-transit 只重跑本段内联脚本、不会带上外部 <script src>，
       因此函数缺失时按站点根动态补载（file:// 下 script 本地加载同样可用） */
    (function () {
        if (typeof window.OptionextNewsDrawer === 'function') {
            window.OptionextNewsDrawer();
            return;
        }
        var root = window.__OPTIONEXT_ROOT__ || '../';
        var s = document.createElement('script');
        s.src = root + 'components/news-drawer.js?v=20261015f';
        s.onload = function () {
            if (typeof window.OptionextNewsDrawer === 'function') window.OptionextNewsDrawer();
        };
        s.onerror = function () {
            var box = document.querySelector('.registry');
            if (box && !box.parentNode.querySelector('.news-fatal')) {
                var d = document.createElement('div');
                d.className = 'news-fatal';
                d.textContent = '板块脚本加载失败：components/news-drawer.js 无法载入，请检查部署后强制刷新。';
                box.parentNode.insertBefore(d, box);
            }
        };
        document.head.appendChild(s);
    })();
    </script>
    <!-- 部署自检：脚本漏传 / 被拦截时给出显性红条，而不是“点了没反应” -->
    <script>
        window.addEventListener('load', function () {
            setTimeout(function () {
                if (typeof window.OptionextNewsDrawer === 'function') return;
                var box = document.querySelector('.registry');
                if (!box || box.querySelector('.news-fatal')) return;
                var d = document.createElement('div');
                d.className = 'news-fatal';
                d.textContent = '板块脚本未加载：components/news-drawer.js 缺失或被拦截。' +
                    '云端部署请整目录覆盖上传；本地请强制刷新（Ctrl+F5）后重试。';
                box.parentNode.insertBefore(d, box);
            }, 300);
        });
    </script>
    <!-- 页面清单：file:// 直开时供软导航取页（必须在软导航之前） -->
    <script src="../components/page-manifest.js?v=20261015g"></script>
    <!-- 软导航：页眉保活 + 主体淡入淡出（必须在页眉组件之后） -->
    <script src="../components/page-transit.js?v=20261015f"></script>
</body>
</html>
